# Classic Studio Theme
# Grand hotel ballroom with luxurious interior

meta:
  slug: classic_studio
  name_ko: 클래식 스튜디오
  name_en: Classic Studio
  description: Luxurious grand hotel ballroom with elegant classical interior

main:
  full_body:
    camera: A front-facing full body portrait of a Korean couple standing together in a grand ballroom, looking directly at the camera
    composition: Wide angle shot capturing both figures from head to toe with majestic interior elements

  closeup:
    camera: An upper body portrait shot of the Korean couple in an elegant ballroom setting, facing the camera
    composition: Medium close-up focusing on the upper body and faces with ornate background softly blurred

  scene:
    background: A grand hotel ballroom interior with ornate crystal chandeliers, tall marble columns with gold accents, rich burgundy velvet drapes, and intricate ceiling moldings
    atmosphere: Modern luxury, high-end editorial, sophisticated, grand

  lighting:
    description: Professional studio lighting focused on subjects with warm ambient background lights, creating a luxurious and clean look

  groom_style:
    attire: Wearing a high-end tailored black tuxedo with satin lapels, a crisp white shirt, and an elegant black bow tie
    hair: modern Korean groom hairstyle, contemporary, clean side texture, no retro slick-back
    pose: Standing tall with distinguished posture and a confident, warm smile

  bride_style:
    attire: Wearing a stunning ball gown wedding dress with intricate beading and a dramatic train
    hair: An elegant updo with sparkling hair accessories
    accessories: Statement diamond jewelry and a cathedral-length veil
    pose: Standing regally with a graceful, poised expression

  quality:
    technical: 8k resolution, rich warm tones, highly detailed textures, sharp focus, professional photography with and 80mm lens

  negative:
    style: illustration, painting, anime, cartoon, 3d render
    quality: text, watermark, low quality, worst quality, blurry
    mood: casual, modern minimalist, cold tones
    posture: |
      (rigid stance:1.3), (military posture:1.3), (stiff pose:1.3),
      (awkward posture:1.2), (formal rigid standing:1.2)

# Face prompts (NO BACKGROUND KEYWORDS!)
groom_face:
  positive:
    core: |
      A closeup portrait showing East Asian facial features, brown eyes, black hair,
      modern trendy hairstyle, natural skin texture, soft studio lighting on the face, neutral color tone.
      (Korean editorial wedding studio:1.3), (Seoul studio look:1.2).
  negative:
    core: |
      woman, girl, female, makeup, lipstick, low quality, oil painting, old photos, yellow skin tone,
      slicked back hair, side-parted retro hair, heavy pomade, vintage hairstyle, old-fashioned,
      (beard:1.4), (stubble:1.4), (facial hair:1.4), (mustache:1.3), (5 o'clock shadow:1.3),
      (retro style:1.2), (old-fashioned look:1.2),
      (excessive smile:1.3), (grinning:1.3), (toothy grin:1.3),
      (exaggerated expression:1.2), (awkward smile:1.3)

bride_face:
  positive:
    core: |
      A closeup portrait showing East Asian facial features, brown eyes, black hair,
      modern bridal makeup, dewy clean skin, soft studio lighting on the face.
      (Korean editorial wedding studio:1.3), (Seoul studio look:1.2).
  negative:
    core: |
      man, boy, male, low quality, heavy makeup, old style,
      (excessive smile:1.2), (forced smile:1.2), (awkward expression:1.2)

hand:
  positive: Detailed, natural-looking hands with proper anatomy
  negative: ""

generation:
  cfg: 1
  steps: 25
  width: 896
  height: 1152

# Workflow node overrides for Admin Prompt Lab
workflow:
  preset: flux_couple_v1
  overrides:
    KSampler:
      sampler_name: euler
      scheduler: simple
      steps: 25
      cfg: 1
    GroomFaceDetailer:
      denoise: 0.42
      steps: 15
      cfg: 1
      guide_size: 512
      feather: 3
      noise_mask_feather: 10
    BrideFaceDetailer:
      denoise: 0.42
      steps: 15
      cfg: 1
      guide_size: 512
      feather: 3
      noise_mask_feather: 10
    HandDetailer:
      denoise: 0.35
      steps: 10
      cfg: 8
      guide_size: 512
    Detector:
      face_threshold: 0.25
      face_dilation: 6
      face_crop_factor: 2.4
      face_drop_size: 5
      hand_threshold: 0.4
      hand_crop_factor: 3

options:
  include_main_triggers: false
